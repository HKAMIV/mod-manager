name: Release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  # Each platform builds + signs its bundles and attaches them DIRECTLY to the
  # GitHub Release. We avoid actions/upload-artifact for the bundles (release
  # assets don't count against the Actions artifact-storage quota). The small
  # updater signatures ARE passed between jobs as artifacts so the final job can
  # assemble a single latest.json — they're a few hundred bytes, negligible.
  #
  # Signing: `createUpdaterArtifacts` is on in tauri.conf.json, and the signing
  # key is provided via the TAURI_SIGNING_* secrets, so `tauri build` emits a
  # signed updater bundle (+ .sig) for each platform.
  release-linux:
    runs-on: ubuntu-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install frontend deps
        run: npm ci
      - name: Build Tauri (Linux)
        run: npx tauri build --bundles appimage,deb
      # Tauri's AppImage over-bundles its own Wayland client libraries. On
      # SteamOS/Steam Deck (Mesa 25+) the stale bundled libwayland-client makes
      # eglGetDisplay fail with EGL_BAD_PARAMETER and WebKitWebProcess aborts ->
      # blank window. Every Wayland system provides these at the correct version,
      # so we strip the bundled copies and repack. Repacking invalidates the
      # updater signature tauri build produced, so we RE-SIGN the repacked
      # AppImage afterwards. (See tauri#15665.)
      - name: Strip bundled Wayland libs and re-sign the AppImage
        run: |
          set -euo pipefail
          APPDIR="src-tauri/target/release/bundle/appimage"
          APPIMAGE="$(ls "$APPDIR"/*.AppImage | head -n1)"
          echo "Post-processing: $APPIMAGE"

          "$APPIMAGE" --appimage-extract >/dev/null
          rm -f "$APPIMAGE" "$APPIMAGE.sig"

          find squashfs-root -type f \
            \( -name 'libwayland-client.so*' \
            -o -name 'libwayland-egl.so*' \
            -o -name 'libwayland-cursor.so*' \
            -o -name 'libwayland-server.so*' \) -print -delete

          curl -L -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run squashfs-root "$APPIMAGE"
          rm -rf squashfs-root appimagetool
          echo "Repacked: $APPIMAGE"

          # Re-sign the repacked AppImage so the updater signature matches.
          npx tauri signer sign \
            --private-key "$TAURI_SIGNING_PRIVATE_KEY" \
            --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
            "$APPIMAGE"
          echo "Re-signed: $APPIMAGE.sig"
      - name: Stage updater signature for manifest
        run: |
          set -euo pipefail
          APPDIR="src-tauri/target/release/bundle/appimage"
          APPIMAGE="$(ls "$APPDIR"/*.AppImage | head -n1)"
          mkdir -p sig-out
          echo "$(basename "$APPIMAGE")" > sig-out/linux-file.txt
          cp "$APPIMAGE.sig" sig-out/linux.sig
      - name: Upload Linux signature
        uses: actions/upload-artifact@v4
        with:
          name: sig-linux
          path: sig-out/
          retention-days: 1
      - name: Attach Linux bundles to release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb

  release-macos:
    runs-on: macos-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install frontend deps
        run: npm ci
      - name: Build Tauri (macOS)
        run: npx tauri build --bundles app,dmg
      - name: Stage updater artifacts for manifest
        run: |
          set -euo pipefail
          MAC="src-tauri/target/release/bundle/macos"
          # The updater bundle is the app tarball tauri build produced.
          TARBALL="$(ls "$MAC"/*.app.tar.gz | head -n1)"
          mkdir -p sig-out
          echo "$(basename "$TARBALL")" > sig-out/macos-file.txt
          cp "$TARBALL.sig" sig-out/macos.sig
          cp "$TARBALL" sig-out/updater-tarball.tar.gz
      - name: Upload macOS updater artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sig-macos
          path: sig-out/
          retention-days: 1
      - name: Attach macOS bundles to release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz

  # Assemble a single latest.json the updater endpoint points at, using the
  # signatures produced by each platform build, and attach it to the release.
  updater-manifest:
    needs: [release-linux, release-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download signatures
        uses: actions/download-artifact@v4
        with:
          path: sigs
      - name: Build latest.json
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          REPO="${GITHUB_REPOSITORY}"
          BASE="https://github.com/$REPO/releases/download/${GITHUB_REF_NAME}"
          NOTES="See the release notes at https://github.com/$REPO/releases/tag/${GITHUB_REF_NAME}"

          LINUX_FILE="$(cat sigs/sig-linux/linux-file.txt)"
          LINUX_SIG="$(cat sigs/sig-linux/linux.sig)"
          MAC_FILE="$(cat sigs/sig-macos/macos-file.txt)"
          MAC_SIG="$(cat sigs/sig-macos/macos.sig)"

          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # URL-encode spaces in filenames for the download URLs.
          enc() { echo "$1" | sed 's/ /%20/g'; }

          cat > latest.json <<EOF
          {
            "version": "$VERSION",
            "notes": "$NOTES",
            "pub_date": "$PUB_DATE",
            "platforms": {
              "linux-x86_64": {
                "signature": "$LINUX_SIG",
                "url": "$BASE/$(enc "$LINUX_FILE")"
              },
              "darwin-x86_64": {
                "signature": "$MAC_SIG",
                "url": "$BASE/$(enc "$MAC_FILE")"
              },
              "darwin-aarch64": {
                "signature": "$MAC_SIG",
                "url": "$BASE/$(enc "$MAC_FILE")"
              }
            }
          }
          EOF
          echo "Generated latest.json:"
          cat latest.json
      - name: Attach latest.json to release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: latest.json
