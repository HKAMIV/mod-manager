name: Release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  # Each platform builds + signs its bundles and attaches them DIRECTLY to the
  # GitHub Release — including the tiny updater .sig files. We deliberately do
  # NOT use actions/upload-artifact anywhere: that's a separate, limited quota
  # ("Artifact storage quota has been hit") which is easy to exhaust. Instead
  # the manifest job reads the signatures back from the release assets, and the
  # bundle filenames are passed between jobs as free job OUTPUTS (not artifacts).
  #
  # Signing: `createUpdaterArtifacts` is on in tauri.conf.json and the signing
  # key comes from the TAURI_SIGNING_* secrets, so `tauri build` emits a signed
  # updater bundle (+ .sig) per platform.
  release-linux:
    runs-on: ubuntu-latest
    outputs:
      appimage_name: ${{ steps.stage.outputs.appimage_name }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install frontend deps
        run: npm ci
      - name: Build Tauri (Linux)
        run: npx tauri build --bundles appimage,deb
      # Tauri's AppImage over-bundles its own Wayland client libraries. On
      # SteamOS/Steam Deck (Mesa 25+) the stale bundled libwayland-client makes
      # eglGetDisplay fail with EGL_BAD_PARAMETER and WebKitWebProcess aborts ->
      # blank window. Every Wayland system provides these at the correct version,
      # so we strip the bundled copies and repack. Repacking invalidates the
      # updater signature tauri build produced, so we RE-SIGN the repacked
      # AppImage afterwards. (See tauri#15665.)
      - name: Strip bundled Wayland libs and re-sign the AppImage
        id: stage
        run: |
          set -euo pipefail
          APPDIR="src-tauri/target/release/bundle/appimage"
          APPIMAGE="$(ls "$APPDIR"/*.AppImage | head -n1)"
          echo "Post-processing: $APPIMAGE"

          "$APPIMAGE" --appimage-extract >/dev/null
          rm -f "$APPIMAGE" "$APPIMAGE.sig"

          find squashfs-root -type f \
            \( -name 'libwayland-client.so*' \
            -o -name 'libwayland-egl.so*' \
            -o -name 'libwayland-cursor.so*' \
            -o -name 'libwayland-server.so*' \) -print -delete

          curl -L -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run squashfs-root "$APPIMAGE"
          rm -rf squashfs-root appimagetool
          echo "Repacked: $APPIMAGE"

          # Re-sign the repacked AppImage so the updater signature matches.
          npx tauri signer sign \
            --private-key "$TAURI_SIGNING_PRIVATE_KEY" \
            --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
            "$APPIMAGE"
          echo "Re-signed: $APPIMAGE.sig"

          # Expose the AppImage filename to the manifest job (free job output).
          echo "appimage_name=$(basename "$APPIMAGE")" >> "$GITHUB_OUTPUT"
      - name: Attach Linux bundles + signature to release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/deb/*.deb

  release-macos:
    runs-on: macos-latest
    outputs:
      tarball_name: ${{ steps.stage.outputs.tarball_name }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install frontend deps
        run: npm ci
      - name: Build Tauri (macOS)
        run: npx tauri build --bundles app,dmg
      - name: Record updater tarball name
        id: stage
        run: |
          set -euo pipefail
          MAC="src-tauri/target/release/bundle/macos"
          TARBALL="$(ls "$MAC"/*.app.tar.gz | head -n1)"
          echo "tarball_name=$(basename "$TARBALL")" >> "$GITHUB_OUTPUT"
      - name: Attach macOS bundles + signature to release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig

  # Assemble the single latest.json the updater endpoint points at. Reads the
  # .sig files back FROM THE RELEASE (no artifact storage) and uses the bundle
  # filenames passed as job outputs. Attaches latest.json to the release.
  updater-manifest:
    needs: [release-linux, release-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Build and attach latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_NAME: ${{ needs.release-linux.outputs.appimage_name }}
          TARBALL_NAME: ${{ needs.release-macos.outputs.tarball_name }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          REPO="${GITHUB_REPOSITORY}"
          TAG="${GITHUB_REF_NAME}"
          BASE="https://github.com/$REPO/releases/download/$TAG"
          NOTES="See the release notes at https://github.com/$REPO/releases/tag/$TAG"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # Download the .sig assets back from the release (authenticated, so it
          # works even before the release is public). Retry briefly in case the
          # asset isn't queryable the instant the build job finished.
          fetch_sig() {
            local asset="$1" out="$2" i
            for i in 1 2 3 4 5; do
              if gh release download "$TAG" --repo "$REPO" --pattern "$asset" --output "$out" --clobber 2>/dev/null; then
                return 0
              fi
              echo "retry $i: $asset not available yet"; sleep 5
            done
            echo "ERROR: could not download $asset from release $TAG" >&2
            return 1
          }

          fetch_sig "${APPIMAGE_NAME}.sig" linux.sig
          fetch_sig "${TARBALL_NAME}.sig" macos.sig
          LINUX_SIG="$(cat linux.sig)"
          MAC_SIG="$(cat macos.sig)"

          enc() { echo "$1" | sed 's/ /%20/g'; }

          cat > latest.json <<EOF
          {
            "version": "$VERSION",
            "notes": "$NOTES",
            "pub_date": "$PUB_DATE",
            "platforms": {
              "linux-x86_64": {
                "signature": "$LINUX_SIG",
                "url": "$BASE/$(enc "$APPIMAGE_NAME")"
              },
              "darwin-x86_64": {
                "signature": "$MAC_SIG",
                "url": "$BASE/$(enc "$TARBALL_NAME")"
              },
              "darwin-aarch64": {
                "signature": "$MAC_SIG",
                "url": "$BASE/$(enc "$TARBALL_NAME")"
              }
            }
          }
          EOF
          echo "Generated latest.json:"; cat latest.json

          gh release upload "$TAG" latest.json --repo "$REPO" --clobber
