[package]
name = "mod-manager"
version = "0.13.0"
description = "A mod manager for Arch Linux and SteamOS"
authors = ["you"]
edition = "2021"

[lib]
name = "mod_manager_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
notify = "6"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3.34"
zip = { version = "8.6.0", default-features = false, features = ["deflate", "bzip2"] }
sevenz-rust2 = "0.22.2"
uuid = { version = "1.26.0", features = ["v4"] }
unrar = "0.5.8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", features = ["NSProcessInfo", "NSString", "NSObject"] }
objc2 = "0.6.4"
